@let algorithm = activeAlgorithm();
<div class="flex-column details-container">
	<div class="details section">
		<h3> {{algorithm.name}} Steps</h3>
		<ol>
			@for(step of algorithm.steps; track step.stepNumber) {
			<li>{{step.description}} </li>
			}
		</ol>
	</div>

	<div class="pseudocode section">
		<h3>Pseudocode</h3>
		<div class="pseudocode-container flex-column">
			@for(line of algorithm.pseudocodeLines; track line.text){
			<span [style.padding-left.rem]="line.indent * 1.5"> {{ line.text }}</span>
			}
		</div>
	</div>
</div>
