<div class="stage-wrapper flex-column">
	<div class="viewport">
		@switch (manager.activeView().category) {

		@case ('sorting') {
		<ng-container *ngTemplateOutlet="array1dTemplate" />
		}
		@case ('searching') {
		<ng-container *ngTemplateOutlet="array1dTemplate" />
		}
		@case ('graphs') {
		<div class="canvas-container flex-row middle">
			<canvas #gridCanvas width="750" height="300"></canvas>
		</div>
		}
		}
	</div>
	<div class="status-bar flex-row space_between middle">
		<p class="description">
			<strong>Current action: </strong>{{ manager.currentStep()?.description || 'Ready' }}
		</p>
		<span class="step-badge">
			Step {{ manager.currentStepIndex() + 1 }} / {{ manager.steps().length }}
		</span>
	</div>
</div>

<ng-template #array1dTemplate>
	<div class="svg-container flex-row middle">
		@if (manager.currentStep(); as step) {
		<svg viewBox="0 0 800 300" preserveAspectRatio="none">
			@for (value of arrayData(); track $index) {
			<g>
				<rect [attr.x]="$index * barWidth()" [attr.y]="300 - (value * scaleFactor())"
					[attr.width]="barWidth() - 2" [attr.height]="value * scaleFactor()"
					[attr.fill]="getBarColor($index, step)" class="bar" />
				@if (barWidth() > 20) {
				<text [attr.x]="$index * barWidth() + (barWidth() - 2) / 2" [attr.y]="290 - (value * scaleFactor())"
					text-anchor="middle" fill="#cdd6f4" font-size="11">
					{{ value }}
				</text>
				}
			</g>
			}
		</svg>
		}
	</div>
</ng-template>
