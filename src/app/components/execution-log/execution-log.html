<div class="steps-wrapper flex-column">
	<div class="previous-steps-container flex-column">
		@for(step of steps(); track step) {
		@if($index < currentStepIndex() + 1) { <p [class.final]="step.description.includes('complete')">
			[ {{currentTime() | date:'HH:mm:ss.SS'}} ] {{ step.description }}
			</p>
			}
			}
	</div>
	<div class="current-step-container">
		@if (steps()[currentStepIndex() + 1]; as activeStep) {
		<p class="active"> [ {{currentTime() | date:'HH:mm:ss.SS'}} ] {{ activeStep.description }}</p>
		}
	</div>
</div>
