@for (group of algorithmConfig | keyvalue; track group.key) {
<div class="list-section">
	<p class="group-title">{{ sectionTitle[group.key] }}</p>

	<ul class="flex-column">
		@for (algorithm of group.value; track algorithm.key) {
		@let isActive = algorithm.key === activeView().id;
		<li class="flex-row middle space-between" [class.active]="isActive" (click)="updateView(algorithm.key)">
			<p class="flex-row middle">
				<span class="material-icons-outlined" [class.rotate]="algorithm?.rotate">{{algorithm.icon}}</span>
				<span class="title">{{ algorithm.title }}</span>
			</p>
			@if(isActive){
			<span class="material-icons-outlined arrow">arrow_left </span>
			}
		</li>
		}
	</ul>
</div>
}
