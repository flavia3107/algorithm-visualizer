@for (group of algorithmConfig | keyvalue; track group.key) {
<div class="list-section">
	<p>{{ group.key }}</p>

	<ul class="flex-column">
		@for (algorithm of group.value; track algorithm.key) {
		<li class="flex-row middle" (click)="updateView(algorithm.key)">
			<span class="material-icons-outlined" [class.rotate]="algorithm?.rotate">{{algorithm.icon}}</span>
			{{ algorithm.title }}
		</li>
		}
	</ul>
</div>
}
