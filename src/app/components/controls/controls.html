@let algorithm = activeAlgorithm();
<div class="flex-row space_between middle wrap">
	<div class="summary flex-column">
		<span>{{algorithm.name}}</span>
		<span class="description">{{algorithm.summary}}</span>
	</div>
	<div class="controls flex-row middle">
		<button (click)="resetSteps()" class="flex-row middle btn">
			<span class="material-icons-outlined reset"> restore </span>
			<span>Reset</span>
		</button>
		<button (click)="stepBackward()" class="flex-row middle btn">
			<span class="material-icons-outlined"> first_page </span>
			<span>Step Back</span>
		</button>
		<span (click)="playOrStopAlgorithm()" class="material-icons-outlined">
			{{isPlaying() ? 'pause': 'play_arrow'}}
		</span>
		<button (click)="stepForward()" class="flex-row middle btn">
			<span> Step Forward </span>
			<span class="material-icons-outlined"> last_page</span>
		</button>
		<button (click)="skipToEnd()" class="flex-row middle btn">
			<span>Skip to End</span>
			<span class="material-icons-outlined"> fast_forward </span>
		</button>
	</div>
	<div class="size-controls speed-control-wrapper">
		<span class="material-icons-outlined speed-icon">speed</span>
		<input type="range" min="10" max="500" step="10" [value]="speedDelayMs()"
			(input)="setSpeed($event.target.value)" class="speed-range" title="Execution Speed" />
		<span class="speed-value">{{ speedDelayMs() }}ms</span>
	</div>
</div>
