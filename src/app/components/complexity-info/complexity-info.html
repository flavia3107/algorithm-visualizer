@let algorithm = activeAlgorithm();
<div class="flex-column">
	<div class="details">
		<h5> Time Complexity</h5>
		<div class="complexity-details flex-row space_between">
			@for(item of complexityItem; track item) {
			<p class="flex-column"><strong>{{item}}</strong><span>{{algorithm.timeComplexity[item]}}</span></p>
			}
		</div>
	</div>

	<div class="pseudocode">
		<h5>Space Complexity</h5>
		<p class="complexity-details">
			{{algorithm.spaceComplexity}}
		</p>
	</div>
</div>
