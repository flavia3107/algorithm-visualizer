@let algorithm = activeAlgorithm();
<div class="flex-column">
	<div class="details">
		<h5> Time Complexity</h5>
		<div class="complexity-details flex-row">
			<p class="flex-column"><strong>Best</strong><span>{{algorithm.timeComplexity.best}}</span></p>
			<p class="flex-column"><strong>average</strong><span>{{algorithm.timeComplexity.average}}</span></p>
			<p class="flex-column"> <strong>worst</strong> <span>{{algorithm.timeComplexity.worst}}</span></p>
		</div>
	</div>

	<div class="pseudocode">
		<h5>Space Complexity</h5>
		<p class="complexity-details">
			{{algorithm.spaceComplexity}}
		</p>
	</div>
</div>
