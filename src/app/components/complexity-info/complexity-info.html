@let algorithm = activeAlgorithm();
<div class="flex-column main-container">
	<div class="pseudocode">
		<h5>Space Complexity</h5>
		<p class="complexity-details item value">
			{{algorithm.spaceComplexity}}
		</p>
	</div>
	<div class="details">
		<h5> Time Complexity</h5>
		<div class="complexity-details flex-row space-between">
			@for(item of complexityItem; track item) {
			<p class="flex-column item">
				<strong>{{item}}</strong>
				<span class="value">{{algorithm.timeComplexity[item]}}</span>
			</p>
			}
		</div>
	</div>
</div>
