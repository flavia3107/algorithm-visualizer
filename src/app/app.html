<div class="flex-row title-row middle">
	<a href="https://all-projects-portfolio.web.app/" target="_blank">
		<img src="/images/logo.svg" />
	</a>
</div>
<div class="flex-row main">
	<div class="flex-column sidenav section">
		<app-sidenav />
	</div>
	<div class="content flex-column">
		<div class="subtitle">Algorithm</div>
		<span class="algorithm-title">{{activeView().name}}</span>
		<div class="flex-row controls bottom section">
			<app-controls />
		</div>
		<div class="flex-row visualizer-row">
			<div class="graph section">
				<app-visualizer />
			</div>
			<div class="flex-column algorithm-details">
				<app-details />
			</div>
		</div>

		<div class="flex-row data-log space_between">
			<div class="execution-log section">
				<h3 class="flex-row middle">
					<span class="material-symbols-outlined">terminal_2 </span>
					Execution Log
				</h3>
				<app-execution-log />
			</div>
			<div class="complexity section">
				<h3>Complexity</h3>
				<app-complexity-info />
			</div>
			<div class="data-structure section">
				<h3>Data Structure</h3>
				<app-data-structure />
			</div>
		</div>
	</div>
</div>
